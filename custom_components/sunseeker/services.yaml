start_mowing:
  name: Start mowing
  description: >
    Start the mower and optionally specify a list of zones to mow.
    If no zones are provided, the mower will use its default behavior.
  fields:
    entity_id:
      name: Mower entity
      description: The mower entity to control.
      required: true
      selector:
        entity:
          domain: lawn_mower
    zones:
      name: Zones
      description: A list of zone names to mow.
      required: true
      example: ["Front yard", "Back yard"]
      selector:
        object: {}

stop_mowing:
  name: Stop mowing
  description: >
    Stops the mower.
  fields:
    entity_id:
      name: Mower entity
      description: The mower entity to control.
      required: true
      selector:
        entity:
          domain: lawn_mower

start_mowing_selected_area:
  name: Start mowing selected area
  description: >
    Start mowing a manually selected polygon area.
  fields:
    entity_id:
      name: Mower entity
      description: The mower entity to control.
      required: true
      selector:
        entity:
          domain: lawn_mower
    points:
      name: Area points
      description: >
        Polygon points for the selected area in order. Each point must be [x, y].
      required: true
      example: [[-2.815, -3.892], [9.636, -3.892], [9.636, -7.401], [2.215, -7.401]]
      selector:
        object: {}

stop_task:
  name: Stop task
  description: >
    Stop the current mower task.
  fields:
    entity_id:
      name: Mower entity
      description: The mower entity to control.
      required: true
      selector:
        entity:
          domain: lawn_mower

set_pin:
  name: Change pin
  description: >
    Change the mowers 4 digit pin code.
  fields:
    entity_id:
      name: Mower entity
      description: The mower entity.
      required: true
      selector:
        entity:
          domain: lawn_mower
    old_pin:
      name: Old pin code
      description: The mowers old 4 digits pin code.
      required: true
      selector:
        text:
    new_pin:
      name: New pin code
      required: true
      description: The mowers new 4 digits pin code.
      selector:
        text:

set_schedule:
  name: Set schedule
  description: >
    Set the mowing schedule for your Sunseeker mower. You must provide the Schedule sensor entity and a complete schedule object.
    The format differs depending on model type — see the examples below.
  fields:
    entity_id:
      name: Schedule sensor entity
      description: The mower's Schedule sensor entity (the one that has the schedule attribute).
      required: true
      selector:
        entity:
          domain: sensor
    schedule:
      name: Schedule
      description: >
        The schedule data to apply. The format depends on the model type.
        For old wired models include "model_type": "old" and provide one entry per day with enabled, starttime, endtime, and trim fields.
        For old wired models supporting 2 timeslots per day, include "model_type": "old", a top-level "pause" flag, and provide up to two time-slot entries per day with enabled, starttime, endtime, and trim fields (no locations).
        For wireless models (V/V1/X/S) omit model_type and provide up to two time-slot entries per day plus the top-level mode flags.
      required: true
      example: |
        # Old wired model example (1 timeslot per day):
        {
          "model_type": "old",
          "monday":    { "enabled": true,  "starttime": "08:00", "endtime": "11:00", "trim": false },
          "tuesday":   { "enabled": true,  "starttime": "08:00", "endtime": "11:00", "trim": false },
          "wednesday": { "enabled": false, "starttime": "00:00", "endtime": "00:00", "trim": false },
          "thursday":  { "enabled": true,  "starttime": "08:00", "endtime": "11:00", "trim": false },
          "friday":    { "enabled": true,  "starttime": "08:00", "endtime": "11:00", "trim": false },
          "saturday":  { "enabled": false, "starttime": "00:00", "endtime": "00:00", "trim": false },
          "sunday":    { "enabled": false, "starttime": "00:00", "endtime": "00:00", "trim": false }
        }

        # Old wired model example (2 timeslots per day):
        {
          "model_type": "old",
          "pause": false,
          "monday": [
            { "enabled": true,  "starttime": "05:00", "endtime": "08:00", "trim": true },
            { "enabled": true,  "starttime": "20:00", "endtime": "22:00", "trim": true }
          ],
          "tuesday":   [],
          "wednesday": [],
          "thursday":  [],
          "friday":    [],
          "saturday":  [],
          "sunday":    []
        }

        # Wireless model example (V/V1/X/S):
        {
          "recommended_time_work": false,
          "user_defined": true,
          "pause": false,
          "locations": ["Front", "Back"],
          "monday": [
            { "enabled": true,  "starttime": "08:00", "endtime": "10:00", "locations": ["Front"] },
            { "enabled": false, "starttime": "00:00", "endtime": "00:00", "locations": [] }
          ],
          "tuesday":   [],
          "wednesday": [],
          "thursday":  [],
          "friday":    [],
          "saturday":  [],
          "sunday":    []
        }

set_map:
  name: Set map
  description: >
    Set the map data for your Sunseeker mower. You must provide the mower entity and a complete map object.
  fields:
    entity_id:
      name: Image entity with map add to attributes
      description: The mowers Image entity to set the map for.
      required: true
      selector:
        entity:
          domain: image
    schedule:
      name: Map data
      description: >
        The map data to apply. This must be a dictionary matching the expected map format.
      required: true
      example: |
        Use the sunseeker-map-edit-card.

restore_map:
  name: Restore map
  description: >
    Restores map from backup for your Sunseeker mower.
  fields:
    entity_id:
      name: Mower entity
      description: The mower entity.
      required: true
      selector:
        entity:
          domain: lawn_mower
    mapid:
      name: Mapid to restore
      description: The backup mapid to restore.
      required: true
      selector:
        text:
backup_map:
  name: Backup map
  description: >
    Backup the curret map for your Sunseeker mower.
  fields:
    entity_id:
      name: Mower entity
      description: The mower entity.
      required: true
      selector:
        entity:
          domain: lawn_mower
    mapid:
      name: Mapid to restore
      description: The backup mapid to restore.
      required: true
      selector:
        text:
execute_cmd:
  name: Execute raw mower command
  description: >
    Debug-only service for sending a raw Sunseeker property or action command to a lawn mower entity.
    This command only works when the Sunseeker integration is configured with debug logging enabled.
    Use the command type to choose whether to call get_property, set_property, or set_action.
  fields:
    entity_id:
      name: Mower entity
      description: The mower entity to control.
      required: true
      selector:
        entity:
          domain: lawn_mower
    type:
      name: Command type
      description: The Sunseeker command type to execute.
      required: true
      selector:
        select:
          options:
            - get_property
            - set_property
            - set_action
    data:
      name: Data
      description: The payload to send to the mower command endpoint. appId and deviceSn are added automatically by default.
      required: true
      example: |
        {
          "id": "getDevAllProperty",
          "key": "all",
          "method": "get_property"
        }
      selector:
        object: {}
    cmdurl:
      name: Custom command URL
      description: Optional override for the API command path, for example "/iot_mower/wireless/device/". Leave blank to use the default endpoint.
      required: false
      selector:
        text:
    include_device_data:
      name: Include appId and deviceSn
      description: Add the mower's appId and deviceSn to the payload automatically. Disable this to send exactly the custom data you provide.
      required: false
      default: true
      selector:
        boolean:

delete_backup:
  name: Delete backup map
  description: >
    Delete backup the curret map for your Sunseeker mower.
  fields:
    entity_id:
      name: Mower entity
      description: The mower entity.
      required: true
      selector:
        entity:
          domain: lawn_mower
    mapid:
      name: Mapid to delete
      description: The backup mapid to delete.
      required: true
      selector:
        text:

load_work_record:
  name: Load work record
  description: >
    Load a work record detail for your Sunseeker mower by URL.
  fields:
    entity_id:
      name: Mower entity
      description: The mower entity to load the work record for.
      required: true
      selector:
        entity:
          domain: lawn_mower
    url:
      name: URL
      description: The URL of the work record to load.
      required: true
      selector:
        text:

get_work_records:
  name: Get work records
  description: >
    Retrieve work records for your Sunseeker mower.
  fields:
    entity_id:
      name: Mower entity
      description: The mower entity to get work records for.
      required: true
      selector:
        entity:
          domain: lawn_mower
    pos:
      name: Position
      description: The starting position (page) of the work records to retrieve. Defaults to 1.
      required: false
      default: 1
      selector:
        number:
          min: 1
          mode: box
    count:
      name: Count
      description: The number of work records to retrieve. Defaults to 10, maximum 50.
      required: false
      default: 10
      selector:
        number:
          min: 1
          max: 50
          mode: box
    append:
      name: Append
      description: Whether to append the retrieved records to the existing list. Defaults to false.
      required: false
      default: false
      selector:
        boolean:

cancel_add_work_area:
  name: Cancel add work area
  description: >
    Abort the running Bluetooth session that records a new work area and send the mower home.
  fields:
    entity_id:
      name: Image entity with map data
      description: The mowers Image entity used to start the work area recording.
      required: true
      selector:
        entity:
          domain: image

refresh_map:
  name: Refresh map
  description: >
    Force-refetch the map and backup list from the server. Useful after a backup,
    restore, or new work area since the mower can take a moment to upload the
    updated map to the server after the request.
  fields:
    entity_id:
      name: Image entity with map data
      description: The mowers Image entity to refresh.
      required: true
      selector:
        entity:
          domain: image
